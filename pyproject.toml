[project]
name = "qemulab"
version = "0.1.0"
description = "➕ A modern TUI for managing QEMU development environments"
authors = [
    {name = "Jonathan Tobias", email = "jonathantosilva@hotmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "generic-connection-pool>=0.7.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "textual>=7.1.0",
    "typer>=0.21.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
    "taskipy>=1.14.1",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 100
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"qemulab/cli.py" = ["B008"]  # typer declares options as argument defaults

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["qemulab", "tests"]
typeCheckingMode = "basic"
# Follow-up: tighten these to errors once the Textual/pydantic typing issues are fixed.
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportOptionalMemberAccess = "warning"
reportReturnType = "warning"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["qemulab"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Logging configuration - completely suppress logs during tests
log_cli = false                    # Don't show logs in CLI
log_cli_level = "CRITICAL"         # Only show critical logs if enabled
log_file_level = "DEBUG"           # But log everything to file if log_file is set
log_auto_indent = true
# Capture configuration - suppress all output
capture = "sys"                    # Capture stdout/stderr
show_capture = "no"                # Don't show captured output even on failure
# Coverage
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=qemulab",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "-ra",                         # Show summary of all test outcomes
    "--tb=short",                  # Shorter traceback format
    "-p", "no:warnings",           # Disable warnings plugin
]
# Markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
# Filter warnings
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["qemulab"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.taskipy.tasks]
test = "python -m pytest tests -vv"
lint = "ruff check . && ruff format --check ."
format = "ruff format ."
dev = "python -m qemulab.main"
